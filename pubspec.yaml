name: flappy_flame
description: "A flappy bird game because I was bored"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flame: ^1.0.0
  shared_preferences: ^2.0.0
  flame_audio: ^2.1.0
  audioplayers: ^6.0.0  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Include workshop assets for customization
  assets:
    - workshop/assets/
    - workshop/sounds/
    - assets/audio/music/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
